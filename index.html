<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Portfolio | Home</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-color: #0B2545;          /* Deep ocean blue background */
            --accent-white: #ffffff;      /* White accent */
            --accent-black: #000000;      /* Black accent */
            --card-bg: #4A154B;           /* Purple content cards */
            --text-color: #ffffff;        /* Crisp white text */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Navigation Bar */
        nav {
            background-color: var(--accent-black);
            border-bottom: 3px solid var(--accent-white);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
        }
        .nav-logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 1px;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }
        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-white);
            text-decoration: underline;
        }

        /* Header Banner - Static Image */
        .banner-container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 2rem;
        }
        .static-banner {
            width: 100%;
            height: 400px;
            overflow: hidden;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 2px solid var(--accent-white);
        }
        .static-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        /* Main Content Grid Layout - Now featuring 4 wider columns */
        main {
            max-width: 1400px;
            margin: 0 auto 3rem auto;
            padding: 0 2rem;
            display: grid;
            grid-template-columns: 320px 320px 1fr 320px; /* Made slideshows wider & added a 4th column */
            gap: 1.5rem;
            align-items: stretch;
        }

        /* Side Slideshow Containers */
        .side-slideshow {
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            border: 2px solid var(--accent-white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            background-color: var(--accent-black);
            height: 100%;
            min-height: 500px;
        }
        
        .side-slides {
            display: flex;
            flex-direction: column;
            height: 400%;
            width: 100%;
        }
        
        .side-slides img {
            width: 100%;
            height: 25%;
            object-fit: cover;
        }

        /* Group 1 Animations (Left Side Team) */
        .left-outer-anim {
            animation: sideSlideLeft 16s infinite;
        }
        .left-inner-anim {
            animation: sideSlideRight 16s infinite; /* Reverse order to create dynamic movement */
        }

        /* Group 2 Animations (Right Side Mirror) */
        .right-inner-anim {
            animation: sideSlideLeft 16s infinite;
        }
        .right-outer-anim {
            animation: sideSlideRight 16s infinite;
        }

        /* Vertical Sliding Keyframes for 4 images (ss1, ss2, ss3, ss4) */
        @keyframes sideSlideLeft {
            0%, 20% { transform: translateY(0); }
            25%, 45% { transform: translateY(-25%); }
            50%, 70% { transform: translateY(-50%); }
            75%, 95% { transform: translateY(-75%); }
            100% { transform: translateY(0); }
        }

        @keyframes sideSlideRight {
            0%, 20% { transform: translateY(-75%); }
            25%, 45% { transform: translateY(-50%); }
            50%, 70% { transform: translateY(-25%); }
            75%, 95% { transform: translateY(0); }
            100% { transform: translateY(-75%); }
        }

        /* Central Profile Layout */
        .profile-card {
            background-color: var(--card-bg);
            border-radius: 8px;
            padding: 2.5rem;
            display: flex;
            flex-direction: column; /* Changed to stacked layout to accommodate the wider side elements cleanly */
            gap: 2rem;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border: 1px solid rgba(255,255,255,0.1);
            position: relative;
            height: 100%;
            text-align: center;
        }
        .profile-card::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            right: -5px;
            bottom: -5px;
            background-color: var(--accent-black);
            z-index: -1;
            border-radius: 8px;
            opacity: 0.4;
        }
        .profile-img-container {
            flex-shrink: 0;
        }
        .profile-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--accent-white);
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .profile-info {
            width: 100%;
        }
        .profile-info h1 {
            font-size: 2rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--accent-white);
            padding-bottom: 0.5rem;
        }
        .profile-info p {
            margin-bottom: 1.2rem;
            font-size: 1.05rem;
            text-align: left; /* Kept text aligned left for optimal readability */
        }
        .profile-info p:last-child {
            margin-bottom: 0;
        }

        /* Responsive Design */
        @media (max-width: 1200px) {
            main {
                grid-template-columns: 1fr 1fr; /* Stack layout down to 2 columns on medium screens */
                gap: 2rem;
            }
        }
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
            .static-banner {
                height: 250px;
            }
            main {
                grid-template-columns: 1fr; /* Stack into single column on small screen layouts */
            }
            .side-slideshow {
                display: none; /* Hide side showcases on mobile view to preserve container scaling */
            }
        }
    </style>
</head>
