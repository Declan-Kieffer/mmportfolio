<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multimedia Portfolio | Home</title>
    <style>
        /* Base Reset & Variables */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        :root {
            --bg-color: #0B2545;          /* Deep ocean blue background */
            --accent-white: #ffffff;      /* White accent */
            --accent-black: #000000;      /* Black accent */
            --card-bg: #4A154B;           /* Purple content cards */
            --text-color: #ffffff;        /* Crisp white text */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* Navigation Bar */
        nav {
            background-color: var(--accent-black);
            border-bottom: 3px solid var(--accent-white);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .nav-container {
            max-width: 100%;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .nav-logo {
            font-size: 1.4rem;
            font-weight: bold;
            color: var(--text-color);
            text-decoration: none;
            letter-spacing: 1px;
        }
        .nav-links {
            display: flex;
            list-style: none;
            gap: 1.5rem;
        }
        .nav-links a {
            color: var(--text-color);
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
            font-size: 0.95rem;
        }
        .nav-links a:hover, .nav-links a.active {
            color: var(--accent-white);
            text-decoration: underline;
        }

        /* Header Banner Section - Spans completely edge-to-edge */
        .banner-container {
            width: 100%;
            margin-bottom: 0;
        }
        .static-banner {
            width: 100%;
            height: 450px;
            overflow: hidden;
            border-bottom: 2px solid var(--accent-white);
        }
        .static-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center center;
        }

        /* Main Content Grid Layout - Total full-bleed viewport configuration */
        main {
            width: 100%;
            display: grid;
            grid-template-columns: 360px 360px 1fr 360px 360px; 
            align-items: stretch;
            background-color: var(--card-bg); /* Matches central section bg to form seamless edge-to-edge layout */
        }

        /* Side Slideshow Containers */
        .side-slideshow {
            position: relative;
            overflow: hidden;
            border-top: none;
            border-bottom: none;
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            border-right: 1px solid rgba(255, 255, 255, 0.2);
            background-color: var(--accent-black);
            height: 100%;
            min-height: 600px;
        }
        
        .side-slides {
            display: flex;
            flex-direction: column;
            height: 400%;
            width: 100%;
        }
        
        .side-slides img {
            width: 100%;
            height: 25%;
            object-fit: cover;
        }

        /* Sliding Animation Track Classes */
        .left-outer-anim { animation: sideSlideLeft 16s infinite; }
        .left-inner-anim { animation: sideSlideRight 16s infinite; }
        .right-inner-anim { animation: sideSlideLeft 16s infinite; }
        .right-outer-anim { animation: sideSlideRight 16s infinite; }

        /* Vertical Sliding Keyframes for 4 images (ss1, ss2, ss3, ss4) */
        @keyframes sideSlideLeft {
            0%, 20% { transform: translateY(0); }
            25%, 45% { transform: translateY(-25%); }
            50%, 70% { transform: translateY(-50%); }
            75%, 95% { transform: translateY(-75%); }
            100% { transform: translateY(0); }
        }

        @keyframes sideSlideRight {
            0%, 20% { transform: translateY(-75%); }
            25%, 45% { transform: translateY(-50%); }
            50%, 70% { transform: translateY(-25%); }
            75%, 95% { transform: translateY(0); }
            100% { transform: translateY(-75%); }
        }

        /* Central Profile Layout Card - Stretches edge-to-edge seamlessly */
        .profile-card {
            background-color: var(--card-bg);
            padding: 3rem 4rem;
            display: flex;
            flex-direction: column; 
            gap: 2.5rem;
            align-items: center;
            height: 100%;
            text-align: center;
            justify-content: center;
        }
        .profile-img-container {
            flex-shrink: 0;
        }
        .profile-img {
            width: 200px;
            height: 200px;
            object-fit: cover;
            border-radius: 50%;
            border: 4px solid var(--accent-white);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .profile-info {
            width: 100%;
            max-width: 800px; /* Limits paragraph line length internally for optimal text presentation */
            margin: 0 auto;
        }
        .profile-info h1 {
            font-size: 2.5rem;
            margin-bottom: 1.5rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--accent-white);
            padding-bottom: 0.75rem;
            text-transform: uppercase;
        }
        .profile-info p {
            margin-bottom: 1.5rem;
            font-size: 1.1rem;
            text-align: left; 
            line-height: 1.7;
        }
        .profile-info p:last-child {
            margin-bottom: 0;
        }

        /* Responsive Breakpoints */
        @media (max-width: 1600px) {
            main {
                grid-template-columns: 280px 280px 1fr 280px 280px;
            }
        }
        @media (max-width: 1300px) {
            main {
                grid-template-columns: 300px 1fr 300px; /* Reduces to a single slideshow column track on each flank */
            }
            .hide-mid {
                display: none; /* Safely hides outer columns to preserve responsive layout density */
            }
        }
        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr; /* True vertical display flow for tablets or smaller screens */
            }
            .side-slideshow {
                display: none; 
            }
            .profile-card {
                padding: 2.5rem 1.5rem;
            }
        }
        @media (max-width: 768px) {
            .nav-container {
                flex-direction: column;
                gap: 1rem;
                text-align: center;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 1rem;
            }
            .static-banner {
                height: 250px;
            }
        }
    </style>
</head>
